
name: SplitCircle Backend Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  DEPLOYMENT_BUCKET: splitcircle-deployments-9330

jobs:
  deploy:
    name: Package and Upload Backend
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------
      # Checkout Repository
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------
      # AWS Authentication using OIDC
      # --------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------
      # Package Backend
      # --------------------------------

      - name: Package backend
        run: |
          set -euo pipefail

          tar -czf backend.tar.gz \
            --exclude=node_modules \
            --exclude=.env \
            -C backend .

      # --------------------------------
      # Upload Versioned Release to S3
      # --------------------------------

      - name: Upload backend release to S3
        run: |
          set -euo pipefail

          VERSION="${GITHUB_SHA}"

          aws s3 cp backend.tar.gz \
            "s3://${DEPLOYMENT_BUCKET}/releases/${VERSION}/backend.tar.gz"

      # --------------------------------
      # Update Latest Version Pointer
      # --------------------------------

      - name: Update latest.json
        run: |
          set -euo pipefail

          echo "{\"version\":\"${GITHUB_SHA}\"}" > latest.json

          aws s3 cp latest.json \
            "s3://${DEPLOYMENT_BUCKET}/latest.json"

      # --------------------------------
      # Deploy to Existing EC2 Instances using SSM
      # --------------------------------

      - name: Deploy backend using SSM
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_SHA}"

          # Create deployment script

          cat > deploy.sh <<EOF
          #!/bin/bash
          set -euo pipefail

          APP_DIR="/opt/splitcircle"
          RELEASE_DIR="\$APP_DIR/releases/${VERSION}"

          mkdir -p "\$RELEASE_DIR"

          aws s3 cp \
            "s3://${DEPLOYMENT_BUCKET}/releases/${VERSION}/backend.tar.gz" \
            /tmp/backend.tar.gz

          tar -xzf /tmp/backend.tar.gz -C "\$RELEASE_DIR"

          cd "\$RELEASE_DIR"

          npm ci --omit=dev

          chown -R ec2-user:ec2-user "\$APP_DIR"

          ln -sfn "\$RELEASE_DIR" "\$APP_DIR/current"

          systemctl restart splitcircle-backend

          systemctl is-active --quiet splitcircle-backend

          echo "Backend deployment completed successfully"
          EOF

          # Create SSM parameters

          jq -n \
            --arg command "$(cat deploy.sh)" \
            '{commands: [$command]}' > ssm-parameters.json

          # Send deployment command

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets \
              "Key=tag:Application,Values=SplitCircle" \
              "Key=tag:Role,Values=Backend" \
            --parameters file://ssm-parameters.json \
            --comment "SplitCircle deployment ${VERSION}" \
            --max-concurrency "100%" \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          # --------------------------------
          # Wait for SSM Deployment Results
          # --------------------------------

          DEPLOYMENT_SUCCESS=false

          for i in {1..60}; do

            echo "Checking deployment status... Attempt ${i}/60"

            aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --output json > invocations.json

            COUNT=$(jq '.CommandInvocations | length' invocations.json)

            if [ "${COUNT}" -eq 0 ]; then
              echo "Waiting for SSM instances..."
              sleep 10
              continue
            fi

            echo "Instances receiving command: ${COUNT}"

            # Check whether all instances succeeded

            if jq -e \
              'all(.CommandInvocations[]; .Status == "Success")' \
              invocations.json > /dev/null; then

              echo "Deployment successful on all reported instances"

              DEPLOYMENT_SUCCESS=true
              break
            fi

            # Check for deployment failures

            if jq -e \
              'any(.CommandInvocations[];
                .Status as $status |
                ([
                  "Failed",
                  "Cancelled",
                  "TimedOut",
                  "Undeliverable",
                  "Terminated",
                  "DeliveryTimedOut",
                  "ExecutionTimedOut",
                  "AccessDenied",
                  "InvalidPlatform"
                ] | index($status)) != null
              )' \
              invocations.json > /dev/null; then

              echo "Deployment failed"

              cat invocations.json

              exit 1
            fi

            sleep 10

          done

          # --------------------------------
          # Final Deployment Verification
          # --------------------------------

          if [ "${DEPLOYMENT_SUCCESS}" != "true" ]; then

            echo "Deployment did not complete successfully within the timeout"

            cat invocations.json

            exit 1

          fi

          echo "=================================="
          echo "SplitCircle Backend Deployment OK"
          echo "Version: ${VERSION}"
          echo "=================================="
